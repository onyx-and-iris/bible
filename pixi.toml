[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]
preview = ["pixi-build"]
name = "bible"
version = "0.10.0"

[tasks]
cli = "bible-cli"
tui = "bible-tui"
sync = "python scripts/sync_manifests.py"
fmt = "ruff format"

[tasks.bump]
args = ["kind"]
cmd = "pixi project version {{ kind }}"

[dependencies]
tomlkit = ">=0.15.1,<0.16"
ruff = ">=0.16.7,<0.17"
pyproject-fmt = ">=2.29.4,<3"

[dependencies.bible]
path = "."

[package.build.backend]
name = "pixi-build-python"
version = "0.4.*"

[package.host-dependencies]
hatchling = "==1.26.3"

[package.run-dependencies]
textual = ">=8.2.8"
niquests = ">=3.21.1,<4"
clypi = ">=1.9.1,<2"
pydantic-settings = ">=2.15.0,<3"
rich = ">=15.0.0,<16"
loguru = ">=0.7.3,<0.8"
beautifulsoup4 = ">=4.15.0,<5"
